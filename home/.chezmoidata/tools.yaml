# カテゴリごとに、導入元別のパッケージとバージョンを定義する。
toolCategories:
  ai:
    devbox:
      rtk: "1.2.0"
    devboxLocal:
      apm: [aarch64-darwin]
    vitePlus:
      - name: "@anthropic-ai/claude-code"
        version: "2.1.330"
        node: "26.13.1"
      - name: "@openai/codex"
        version: "0.171.0"
        node: "26.13.1"
      - name: mastracode
        version: "0.50.2"
        node: "24.22.3"

  browser:
    devbox:
      "github:yusukebe/ax#default": ""
    vitePlus:
      - name: agent-browser
        version: "0.43.0"
        node: "24.22.3"

  cloud:
    devboxLocal:
      gcloud: [aarch64-darwin]
      stripe: [aarch64-darwin]
    vitePlus:
      - name: wrangler
        version: "4.166.0"
        node: "24.22.3"
      - name: cf
        version: "1.0.0-rc.2"
        node: "24.22.3"

  data:
    devbox:
      jq: latest
      yq: latest
      xq: latest

  development:
    devbox:
      uv: latest
      "github:ryoppippi/nix-vite-plus#vp": ""
    vitePlus:
      - name: "@hono/cli"
        version: "0.1.11"
        node: "24.22.3"
      - name: "@devcontainers/cli"
        version: "0.91.0"
        node: "24.22.3"
      - name: portless
        version: "0.18.1"
        node: "24.22.3"

  editor-and-files:
    devbox:
      helix: latest
      superfile: latest
      ripgrep: latest
      ast-grep: latest
      fd: latest
      fzf: latest
      eza: latest
      bat: latest
    devboxLocal:
      mo: [aarch64-darwin]

  git:
    devbox:
      gh: latest
      glab: latest
      ghq: latest
      prek: latest
      beads: "1.3.4"

  security:
    devbox:
      _1password-cli: latest

  shell-and-terminal:
    devbox:
      chezmoi: "2.74.1"
      direnv: "2.38.2"
      zoxide: latest
      zsh-powerlevel10k: latest
